  <script>
    document.getElementById('submit').addEventListener('click', function() {
      var answer = document.getElementById('answer').value;
      if (answer.trim()) {
        fetch('https://hooks.slack.com/services/your/webhook/url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: 'Diary access attempt: ' + answer })
        }).catch(() => {});
      }
      window.location.href = '/diary-password';
    });
    
    document.getElementById('answer').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('submit').click();
      }
    });
  </script>
