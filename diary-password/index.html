    .input:focus { border-color: #333; }
    .submit { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    .submit:hover { background: #555; }

<body>
  <div class="container">
    <div class="box">
      <a href="/diary-gate" class="back">← 返回</a>
      <h2 class="title">请输入密码</h2>
      <input type="password" id="password" class="input" placeholder="输入密码...">
      <button id="submit" class="submit">进入</button>
      <p id="error" class="error">密码错误，请重试</p>
    </div>
  </div>
  
  <script>
    var CORRECT_PASSWORD = '11200000';
    
    document.getElementById('submit').addEventListener('click', function() {
      var password = document.getElementById('password').value;
      var error = document.getElementById('error');
      
      if (password === CORRECT_PASSWORD) {
        sessionStorage.setItem('diary_access', 'granted');
        window.location.href = '/categories/日记';
      } else {
        error.style.display = 'block';
      }
    });
    
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('submit').click();
      }
    });
  </script>
</body>
