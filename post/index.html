  <style>

<body>
  <div class="container">
    <header>
      <a href="/" class="back">← 返回首页</a>
      <h1>发布动态</h1>
    </header>
    
    <form class="form" id="postForm" enctype="multipart/form-data">
      <div class="field">
        <label>内容</label>
        <div class="tool-bar">
          <button type="button" class="tool-btn" id="boldBtn"><strong>B</strong></button>
          <button type="button" class="tool-btn" id="italicBtn"><em>I</em></button>
          <button type="button" class="tool-btn" id="linkBtn">🔗</button>
        </div>
        <textarea id="content" placeholder="分享你的想法..."></textarea>
      </div>
      
      <div class="field">
        <label>上传图片/视频/音频</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*">
          <div class="upload-icon">📤</div>
          <div class="upload-text">点击或拖拽上传</div>
          <div class="upload-hint">支持 JPG、PNG、GIF、MP4、MP3 等格式</div>
        </div>
        <div class="preview-list" id="previewList"></div>
      </div>
      
      <div class="field">
        <label>分类</label>
        <select id="category">
          <option value="随笔">随笔</option>
          <option value="摄影">摄影</option>
          <option value="Vlog">Vlog</option>
          <option value="你的故事">你的故事</option>
        </select>
      </div>
      
      <div class="field">
        <label>署名（选填）</label>
        <input type="text" id="author" placeholder="你的名字">
      </div>
      
      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="location.href='/'">取消</button>
        <button type="submit" class="btn btn-primary">发布</button>
      </div>
    </form>
    
    <div id="successMsg" style="display:none; text-align:center; padding:40px; background:#fff; border-radius:8px; margin-top:20px;">
      <div style="font-size:48px; margin-bottom:16px;">🎉</div>
      <p style="font-size:18px; margin-bottom:8px;">发布成功！</p>
      <p style="color:#999;">内容将在审核后显示</p>
    </div>
  </div>
  
  <footer>© 2026</footer>
  
  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const previewList = document.getElementById('previewList');
    const postForm = document.getElementById('postForm');
    const successMsg = document.getElementById('successMsg');
    const content = document.getElementById('content');
    
    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files);
      handleFiles(files);
    });
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      handleFiles(files);
    });
    
    function handleFiles(files) {
      files.forEach(file => {
        const preview = document.createElement('div');
        preview.className = 'preview-item';
        preview.dataset.filename = file.name;
        
        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          preview.appendChild(img);
        } else if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.controls = true;
          preview.appendChild(video);
        } else if (file.type.startsWith('audio/')) {
          const audio = document.createElement('audio');
          audio.src = URL.createObjectURL(file);
          audio.controls = true;
          preview.appendChild(audio);
        }
        
        const removeBtn = document.createElement('button');
        removeBtn.className = 'preview-remove';
        removeBtn.innerHTML = '×';
        removeBtn.addEventListener('click', () => {
          URL.revokeObjectURL(preview.querySelector('img, video, audio')?.src);
          preview.remove();
        });
        preview.appendChild(removeBtn);
        
        previewList.appendChild(preview);
      });
    }
    
    document.getElementById('boldBtn').addEventListener('click', (e) => {
      e.preventDefault();
      insertText('**', '**');
    });
    
    document.getElementById('italicBtn').addEventListener('click', (e) => {
      e.preventDefault();
      insertText('*', '*');
    });
    
    document.getElementById('linkBtn').addEventListener('click', (e) => {
      e.preventDefault();
      const url = prompt('输入链接地址：');
      if (url) {
        insertText('[链接](', `)`, url);
      }
    });
    
    function insertText(before, after, defaultText = '') {
      const start = content.selectionStart;
      const end = content.selectionEnd;
      const selected = content.value.substring(start, end) || defaultText;
      content.value = content.value.substring(0, start) + before + selected + after + content.value.substring(end);
      content.focus();
      content.setSelectionRange(start + before.length, start + before.length + selected.length);
    }
    
    postForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('content', content.value);
      formData.append('category', document.getElementById('category').value);
      formData.append('author', document.getElementById('author').value);
      
      const previews = previewList.querySelectorAll('.preview-item');
      previews.forEach(preview => {
        const media = preview.querySelector('img, video, audio');
        if (media) {
          fetch(media.src)
            .then(res => res.blob())
            .then(blob => {
              formData.append('files', blob, preview.dataset.filename);
            });
        }
      });
      
      fetch('https://api.example.com/submit', {
        method: 'POST',
        body: formData
      }).then(() => {
        postForm.style.display = 'none';
        successMsg.style.display = 'block';
      }).catch(() => {
        alert('提交失败，请重试');
      });
    });
  </script>
</body>
